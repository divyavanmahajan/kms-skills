- id: stanford-hai-earlycareer-decline
  claim: Stanford HAI found early-career workers (ages 22–25) in high-AI-exposure fields saw a ~30% relative
    decline in employment after controlling for firm-level shocks, most acute from late 2022 (a later
    episode, 2025-09-05, relays the same study as a 13% relative decline).
  context: Stanford HAI early-career employment paper, framed as 'consistent with the hypothesis,' not
    proof; the cross-episode figure discrepancy is noted; via The AI Daily Brief episode summary notes
    (2025-08-30). Third-hand.
  confidence: medium
  status: active
