- id: writer-genz-sabotage
  claim: A Writer survey (Dec 2024, 800 employees + 800 executives) found 41% of Gen Z employees reported
    actively sabotaging their company's generative-AI strategy, and 75% of executives said their company
    successfully adopted AI versus only 45% of employees.
  context: Writer survey relayed on-air; via The AI Daily Brief episode summary notes (2025-08-30). Third-hand.
