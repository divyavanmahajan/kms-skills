- id: metr-19-percent-slower
  claim: A METR study of 16 experienced open-source developers on 246 real tasks found AI coding tools
    made them 19% slower, even though they predicted a ~24% speedup and believed afterward they had been
    ~20% faster.
  context: METR study critiqued on the podcast; developers accepted only 44% of AI code and only one of
    16 had over a week of Cursor experience; via The AI Daily Brief episode summary notes. Third-hand.
