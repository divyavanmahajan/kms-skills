- id: velvet-sundown-spotify
  claim: A likely AI-generated band, The Velvet Sundown, accumulated between roughly 300,000 and 634,000
    monthly Spotify listeners largely via algorithmic playlists, yet only about 11,000 of 634,000 monthly
    listeners chose to follow the band.
  context: Central case study on AI music; the band's AI origin is flagged as suspected/unverified; via
