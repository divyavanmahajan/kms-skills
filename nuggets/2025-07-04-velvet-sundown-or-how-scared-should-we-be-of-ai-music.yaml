- id: elvis-act-music-regulation
  claim: The US Senate voted 99–1 to remove a proposed 10-year moratorium on state AI regulation, an outcome
    tied to protecting laws such as Tennessee's Elvis Act, which prohibits non-consensual AI mimicry of
    a musician's voice.
