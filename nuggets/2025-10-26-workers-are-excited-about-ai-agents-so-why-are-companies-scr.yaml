    hybrid human-agent teams.
  context: Host summarizing an EY study (fielded Aug 8–Sep 3, 2025); via The AI Daily Brief episode summary
    notes (2025-10-26). Third-hand.
  quote: 84% of workers said they were eager to embrace agentic AI in their role
