- id: sov-govt-to-govt-chip-agreements
  claim: Anthropic proposed that large-scale chip access for Tier 2 nations be granted only through government-to-government
    agreements — moving chip supply into the realm of foreign policy — while NVIDIA's Jensen Huang argued
    controls should instead 'accelerate the diffusion of American AI technology around the world.'
  context: The AI Daily Brief (2025-05-03) on the Anthropic-NVIDIA clash over the diffusion rule; via
