    investment would 'likely enrich dictators' but concluded Anthropic would accept it on competitive-necessity
    grounds, citing 'a truly giant amount of capital in the Middle East, easily $100 billion or more.'
  context: The AI Daily Brief (2025-07-24) reporting on the leaked memo; via episode summary notes. Third-hand.
