- id: sov-action-plan-open-weights-geostrategic
  claim: The AI Action Plan explicitly endorsed open-source/open-weight AI models as carrying geostrategic
    value, arguing that if the US does not provide leading open models, the world will default to Chinese
    models.
  context: The AI Daily Brief (2025-07-24); via episode summary notes. Third-hand.
