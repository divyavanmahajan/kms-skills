name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Structural lint
        run: python3 scripts/lint.py
      - name: Site builds
        run: |
          python3 scripts/build_browse.py
          mkdocs build
