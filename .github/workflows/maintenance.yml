# Weekly self-maintenance.
#
# Job 1 (no LLM): regenerates the health dashboard and commits it (low risk).
# Job 2 (Claude): runs the /maintain skill — reviews stale pages, fixes lint
# findings, and opens a PR for anything that needs human approval.
#
# Requirements:
#   - ONE repo secret (Settings → Secrets and variables → Actions):
#       CLAUDE_CODE_OAUTH_TOKEN — from a Claude Pro/Max subscription: run
#         `claude setup-token` locally and paste the token (valid ~1 year), OR
#       ANTHROPIC_API_KEY — from platform.claude.com (pay-as-you-go billing)
#   - Settings → Actions → General → Workflow permissions:
#     "Read and write permissions" + "Allow GitHub Actions to create and
#     approve pull requests"
name: Weekly maintenance

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Regenerate dashboard
        run: python3 scripts/dashboard.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki/dashboard.md
          git diff --cached --quiet || git commit -m "dashboard: regenerate"
          git push

  claude-maintenance:
    needs: dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run maintenance session
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Run the weekly maintenance loop for this knowledge base by following
            .claude/skills/maintain/SKILL.md exactly. Obey AGENTS.md: low-risk
            fixes commit directly to main; anything medium/high-risk goes to a
            maintenance/YYYY-MM-DD branch with a PR. Never merge PRs yourself.
          claude_args: "--allowedTools 'Bash,Read,Write,Edit,Glob,Grep,WebFetch'"
